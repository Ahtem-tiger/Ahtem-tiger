<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-label="Tiger Ring screensaver">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120808"/>
      <stop offset="55%" stop-color="#2a1010"/>
      <stop offset="100%" stop-color="#3a1a12"/>
    </linearGradient>
    <linearGradient id="canvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a2a24"/>
      <stop offset="100%" stop-color="#4a1410"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ff4d3d"/>
      <stop offset="100%" stop-color="#f5c542"/>
    </linearGradient>
    <linearGradient id="medal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff3c4"/>
      <stop offset="45%" stop-color="#f5c542"/>
      <stop offset="100%" stop-color="#b06a12"/>
    </linearGradient>
    <linearGradient id="glove" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b5a"/>
      <stop offset="100%" stop-color="#8a1212"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="screen">
      <rect x="18" y="16" width="1164" height="228" rx="16"/>
    </clipPath>
  </defs>

  <rect width="1200" height="260" fill="#070505"/>
  <rect x="18" y="16" width="1164" height="228" rx="16" fill="url(#bg)" stroke="#6a2a24" stroke-width="2"/>

  <g clip-path="url(#screen)">
    <circle cx="980" cy="52" r="28" fill="#f5c542" opacity="0.85"/>
    <circle cx="980" cy="52" r="58" fill="#ff4d3d" opacity="0.14" filter="url(#soft)"/>

    <!-- spotlight beams -->
    <polygon points="980,52 640,244 1182,244" fill="#f5c542" opacity="0.06"/>
    <polygon points="220,16 80,244 380,244" fill="#ff4d3d" opacity="0.05"/>

    <!-- ring ropes -->
    <line x1="18" y1="168" x2="1182" y2="168" stroke="#e8e4dc" stroke-width="4" opacity="0.85"/>
    <line x1="18" y1="188" x2="1182" y2="188" stroke="#c81e1e" stroke-width="4" opacity="0.9"/>
    <line x1="18" y1="208" x2="1182" y2="208" stroke="#e8e4dc" stroke-width="4" opacity="0.7"/>
    <rect x="18" y="220" width="1164" height="24" fill="url(#canvas)"/>

    <!-- falling medals -->
    <g filter="url(#glow)">
      <g>
        <circle r="9" fill="url(#medal)"/>
        <animateTransform attributeName="transform" type="translate" values="220,-20; 236,210" dur="3.1s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle r="8" fill="url(#medal)"/>
        <animateTransform attributeName="transform" type="translate" values="430,-28; 410,214" dur="2.5s" begin="0.4s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle r="10" fill="url(#medal)"/>
        <animateTransform attributeName="transform" type="translate" values="640,-22; 658,212" dur="3.6s" begin="0.9s" repeatCount="indefinite"/>
      </g>
      <g>
        <circle r="8" fill="url(#medal)"/>
        <animateTransform attributeName="transform" type="translate" values="820,-18; 798,214" dur="2.8s" begin="0.6s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- incoming gloves -->
    <g>
      <ellipse rx="14" ry="10" fill="url(#glove)"/>
      <animateTransform attributeName="transform" type="translate" values="320,-18; 308,218" dur="3.4s" begin="0.7s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse rx="13" ry="9" fill="url(#glove)"/>
      <animateTransform attributeName="transform" type="translate" values="740,-22; 760,220" dur="3.9s" begin="1.6s" repeatCount="indefinite"/>
    </g>

    <!-- fighter -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="270,198; 530,198; 790,198; 540,198; 270,198" dur="6.4s" repeatCount="indefinite"/>
      <circle cy="-28" r="9" fill="#e8c8a8"/>
      <rect x="-10" y="-20" width="20" height="18" rx="4" fill="#1a1a1a"/>
      <rect x="-16" y="-8" width="12" height="10" rx="5" fill="#c81e1e"/>
      <rect x="4" y="-8" width="12" height="10" rx="5" fill="#c81e1e"/>
      <rect x="-11" y="-2" width="22" height="16" rx="3" fill="#111"/>
      <rect x="-8" y="12" width="6" height="10" fill="#222"/>
      <rect x="2" y="12" width="6" height="10" fill="#222"/>
    </g>

    <text x="40" y="48" fill="url(#neon)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="22" font-weight="700" letter-spacing="3">TIGER RING</text>
    <text x="40" y="70" fill="#d7b8a8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="1.5">SCREENSAVER  ·  CATCH MEDALS  ·  DODGE GLOVES</text>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
      <text x="40" y="118" fill="#8a6a62" font-size="10">SCORE</text>
      <text x="40" y="140" fill="#ff4d3d" font-size="26" font-weight="700">
        1860
        <animate attributeName="opacity" values="1;0.55;1" dur="1.2s" repeatCount="indefinite"/>
      </text>
      <text x="140" y="118" fill="#8a6a62" font-size="10">BEST</text>
      <text x="140" y="140" fill="#f5c542" font-size="26" font-weight="700">4200</text>
    </g>

    <g transform="translate(980,188)">
      <rect x="0" y="0" width="168" height="36" rx="8" fill="#1a0c0c" stroke="#ff4d3d" stroke-width="1.5"/>
      <text x="84" y="24" text-anchor="middle" fill="#ff4d3d" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700" letter-spacing="2">FIGHT</text>
    </g>

    <g opacity="0.07">
      <line x1="18" y1="40" x2="1182" y2="40" stroke="#fff"/>
      <line x1="18" y1="70" x2="1182" y2="70" stroke="#fff"/>
      <line x1="18" y1="100" x2="1182" y2="100" stroke="#fff"/>
      <line x1="18" y1="130" x2="1182" y2="130" stroke="#fff"/>
      <line x1="18" y1="160" x2="1182" y2="160" stroke="#fff"/>
      <line x1="18" y1="190" x2="1182" y2="190" stroke="#fff"/>
      <line x1="18" y1="220" x2="1182" y2="220" stroke="#fff"/>
    </g>
  </g>
</svg>
